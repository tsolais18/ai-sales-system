<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell! – Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d10;
            --surface: #16161a;
            --surface2: #1e1e24;
            --border: #2a2a32;
            --accent: #7c5cfc;
            --accent-glow: rgba(124, 92, 252, 0.15);
            --text: #e8e8f0;
            --muted: #6b6b7e;
            --success: #22d3a5;
            --warn: #f59e0b;
            --danger: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .syne {
            font-family: 'Syne', sans-serif;
        }

        /* Layout */
        .shell {
            display: flex;
            height: 100dvh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            flex-shrink: 0;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 36px;
            padding: 0 8px;
        }

        .logo-mark {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 18px;
            color: white;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .logo-text {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 20px;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            color: var(--muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 13.5px;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background: var(--surface2);
            color: var(--text);
        }

        .nav-item.active {
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid rgba(124, 92, 252, 0.2);
        }

        .nav-item svg {
            flex-shrink: 0;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--muted);
            padding-left: 4px;
        }

        /* Mobile overlay */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 40;
            backdrop-filter: blur(2px);
        }

        /* Main */
        .main {
            flex: 1;
            overflow-y: auto;
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }

        /* Topbar */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-btn {
            display: none;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px;
            color: var(--text);
            cursor: pointer;
        }

        .topbar-title {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 16px;
        }

        .spinner-wrap {
            margin-left: auto;
        }

        /* Content area */
        #main-content {
            padding: 24px;
            min-height: 100%;
        }

        /* Section header */
        .section-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 24px;
        }

        .section-title {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.5px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            border-radius: 9px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            background: #9070ff;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .btn-ghost {
            background: var(--surface2);
            color: var(--muted);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover {
            color: var(--text);
            border-color: var(--muted);
        }

        /* Filter pills */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .pill {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--muted);
            transition: all 0.2s;
        }

        .pill:hover {
            color: var(--text);
            border-color: var(--muted);
        }

        .pill.active,
        .pill:focus {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            outline: none;
        }


        .pill-warn:hover,
        .pill-warn.active {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warn);
            border-color: var(--warn);
        }

        .pill-success:hover,
        .pill-success.active {
            background: rgba(34, 211, 165, 0.1);
            color: var(--success);
            border-color: var(--success);
        }

        .pill-danger:hover,
        .pill-danger.active {
            background: rgba(244, 63, 94, 0.1);
            color: var(--danger);
            border-color: var(--danger);
        }

        /* Table card */
        .table-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
        }

        /* Responsive table wrapper */
        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }

        thead {
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
        }

        th {
            padding: 12px 20px;
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: var(--surface2);
        }

        td {
            padding: 14px 20px;
            vertical-align: middle;
        }

        .order-id {
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 13px;
            color: var(--accent);
            letter-spacing: 0.02em;
        }

        .customer-name {
            font-weight: 600;
            color: var(--text);
        }

        .item-list {
            color: var(--muted);
            font-size: 13px;
        }

        .item-list div {
            margin-bottom: 2px;
        }

        .amount {
            font-weight: 700;
            font-size: 14px;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
        }

        .badge-pending {
            background: rgba(245, 158, 11, 0.12);
            color: var(--warn);
        }

        .badge-confirmed {
            background: rgba(34, 211, 165, 0.1);
            color: var(--success);
        }

        .badge-cancelled {
            background: rgba(244, 63, 94, 0.1);
            color: var(--danger);
        }

        .badge-in-stock {
            background: rgba(34, 211, 165, 0.1);
            color: var(--success);
        }

        .badge-out {
            background: rgba(244, 63, 94, 0.1);
            color: var(--danger);
        }

        /* Action buttons */
        .action-btn {
            padding: 5px 12px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            background: none;
            transition: all 0.15s;
        }

        .action-confirm {
            color: var(--success);
            border-color: rgba(34, 211, 165, 0.25);
        }

        .action-confirm:hover {
            background: rgba(34, 211, 165, 0.1);
        }

        .action-cancel {
            color: var(--danger);
            border-color: rgba(244, 63, 94, 0.25);
        }

        .action-cancel:hover {
            background: rgba(244, 63, 94, 0.1);
        }

        .action-edit {
            color: var(--accent);
            border-color: rgba(124, 92, 252, 0.25);
        }

        .action-edit:hover {
            background: var(--accent-glow);
        }

        .action-delete {
            color: var(--muted);
            border-color: var(--border);
        }

        .action-delete:hover {
            color: var(--danger);
            border-color: rgba(244, 63, 94, 0.25);
        }

        .actions-cell {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* Empty state */
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--muted);
        }

        .empty-icon {
            font-size: 36px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Product name cell */
        .product-name {
            font-weight: 600;
            color: var(--text);
        }

        /* Add product form container */
        #add-product-form {
            margin-bottom: 20px;
        }

        /* HTMX spinner */
        .htmx-indicator {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .htmx-request .htmx-indicator {
            opacity: 1;
        }

        .spin-ring {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .overlay.open {
                display: block;
            }

            .menu-btn {
                display: flex;
            }

            #main-content {
                padding: 16px;
            }

            .topbar {
                padding: 12px 16px;
            }

            .section-title {
                font-size: 18px;
            }

            th,
            td {
                padding: 10px 14px;
            }
        }

        /* Page load fade-in */
        #main-content {
            animation: fadeUp 0.3s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--muted);
        }
    </style>
</head>

<body>

    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <div class="shell">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <div class="logo-mark">S</div>
                <span class="logo-text">Sell!</span>
            </div>

            <nav style="display:flex;flex-direction:column;gap:4px;">
                <button class="nav-item active" id="nav-products" hx-get="/admin/products" hx-target="#main-content"
                    hx-indicator="#spinner" onclick="setActive('products'); closeSidebar()">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                    </svg>
                    Products
                </button>
                <button class="nav-item" id="nav-orders" hx-get="/admin/orders" hx-target="#main-content"
                    hx-indicator="#spinner" onclick="setActive('orders'); closeSidebar()">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    Orders
                </button>
            </nav>

            <div class="sidebar-footer">Sell! v0.1 &mdash; Multi-tenant AI Sales</div>
        </aside>

        <!-- Main -->
        <div class="main">
            <!-- Topbar -->
            <div class="topbar">
                <button class="menu-btn" onclick="openSidebar()" aria-label="Open menu">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <span class="topbar-title" id="topbar-label">Products</span>
                <div class="spinner-wrap htmx-indicator" id="spinner">
                    <div class="spin-ring"></div>
                </div>
            </div>

            <!-- Content -->
            <div id="main-content">
                <div hx-get="/admin/products" hx-trigger="load"></div>
            </div>
        </div>
    </div>

    <script>
        function openSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('overlay').classList.add('open');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('open');
        }
        function setActive(page) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('nav-' + page).classList.add('active');
            document.getElementById('topbar-label').textContent =
                page.charAt(0).toUpperCase() + page.slice(1);
        }

        // Re-trigger fade animation on HTMX content swap
        document.body.addEventListener('htmx:afterSwap', function (e) {
            if (e.target.id === 'main-content') {
                e.target.style.animation = 'none';
                e.target.offsetHeight; // reflow
                e.target.style.animation = '';
            }
        });
    </script>
</body>

</html>
