<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell! – Admin</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --surface2: #1a1a1a;
            --border: #222222;
            --border2: #2e2e2e;
            --text: #efefef;
            --text2: #888888;
            --text3: #555555;
            --accent: #efefef;
            --success: #4ade80;
            --warn: #fbbf24;
            --danger: #f87171;
            --radius: 8px;
            --sidebar-w: 216px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Instrument Sans', sans-serif;
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            height: 100dvh;
        }

        /* Layout */
        .shell {
            display: flex;
            height: 100dvh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 12px;
            gap: 4px;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 60;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 4px 8px 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
        }

        .logo-mark {
            width: 30px;
            height: 30px;
            background: var(--text);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Geist Mono', monospace;
            font-weight: 600;
            font-size: 14px;
            color: var(--bg);
            flex-shrink: 0;
        }

        .logo-text {
            font-family: 'Geist Mono', monospace;
            font-weight: 600;
            font-size: 15px;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        /* Business switcher */
        .biz-switcher {
            margin-bottom: 12px;
            padding: 0 2px;
        }

        .biz-switcher select {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: var(--radius);
            padding: 8px 28px 8px 10px;
            color: var(--text);
            font-family: 'Instrument Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23555' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 10px center;
            transition: border-color 0.15s;
        }

        .biz-switcher select:focus,
        .biz-switcher select:hover {
            border-color: var(--text3);
        }

        .nav-section-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: var(--text3);
            text-transform: uppercase;
            padding: 8px 10px 4px;
            font-family: 'Geist Mono', monospace;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 9px 10px;
            border-radius: var(--radius);
            color: var(--text2);
            text-decoration: none;
            font-weight: 500;
            font-size: 13.5px;
            transition: background 0.15s, color 0.15s;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            line-height: 1;
        }

        .nav-item:hover {
            background: var(--surface2);
            color: var(--text);
        }

        .nav-item.active {
            background: var(--surface2);
            color: var(--text);
            font-weight: 600;
        }

        .nav-item.active .nav-dot {
            background: var(--text);
        }

        .nav-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: transparent;
            margin-left: auto;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .nav-item svg {
            flex-shrink: 0;
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 16px 10px 0;
            border-top: 1px solid var(--border);
            font-family: 'Geist Mono', monospace;
            font-size: 10px;
            color: var(--text3);
        }

        /* Mobile overlay */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 50;
            backdrop-filter: blur(3px);
        }

        .overlay.open {
            display: block;
        }

        /* Main */
        .main {
            flex: 1;
            overflow-y: auto;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* Topbar */
        .topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 24px;
            height: 52px;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            flex-shrink: 0;
        }

        .menu-btn {
            display: none;
            background: none;
            border: 1px solid var(--border2);
            border-radius: 6px;
            padding: 6px;
            color: var(--text2);
            cursor: pointer;
            line-height: 0;
        }

        .menu-btn:hover {
            color: var(--text);
            border-color: var(--text3);
        }

        .topbar-title {
            font-family: 'Geist Mono', monospace;
            font-size: 13px;
            font-weight: 500;
            color: var(--text2);
        }

        .spinner-wrap {
            margin-left: auto;
        }

        /* Content area */
        #main-content {
            padding: 28px;
            flex: 1;
            overflow-y: auto;
            animation: fadeUp 0.25s ease;
        }

        /* Section header */
        .section-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 22px;
        }

        .section-title {
            font-family: 'Geist Mono', monospace;
            font-weight: 600;
            font-size: 18px;
            letter-spacing: -0.3px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--radius);
            font-family: 'Instrument Sans', sans-serif;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
            border: none;
            text-decoration: none;
            line-height: 1;
        }

        .btn-primary {
            background: var(--text);
            color: var(--bg);
        }

        .btn-primary:hover {
            background: #d8d8d8;
        }

        .btn-ghost {
            background: none;
            color: var(--text2);
            border: 1px solid var(--border2);
        }

        .btn-ghost:hover {
            color: var(--text);
            border-color: var(--text3);
        }

        /* Filter pills */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 18px;
        }

        .pill {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border2);
            background: none;
            color: var(--text2);
            transition: all 0.15s;
            font-family: 'Instrument Sans', sans-serif;
        }

        .pill:hover {
            color: var(--text);
            border-color: var(--text3);
        }

        .pill.active,
        .pill:focus {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
            outline: none;
        }

        .pill-warn:hover,
        .pill-warn.active {
            background: rgba(251, 191, 36, 0.12);
            color: var(--warn);
            border-color: rgba(251, 191, 36, 0.4);
        }

        .pill-success:hover,
        .pill-success.active {
            background: rgba(74, 222, 128, 0.1);
            color: var(--success);
            border-color: rgba(74, 222, 128, 0.35);
        }

        .pill-danger:hover,
        .pill-danger.active {
            background: rgba(248, 113, 113, 0.1);
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.35);
        }

        /* Table card */
        .table-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        /* Responsive table wrapper */
        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 480px;
        }

        thead {
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
        }

        th {
            padding: 11px 18px;
            text-align: left;
            font-size: 10.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: var(--text3);
            white-space: nowrap;
            font-family: 'Geist Mono', monospace;
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.12s;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: var(--surface2);
        }

        td {
            padding: 13px 18px;
            vertical-align: middle;
        }

        .order-id {
            font-family: 'Geist Mono', monospace;
            font-weight: 500;
            font-size: 12.5px;
            color: var(--text2);
        }

        .customer-name {
            font-weight: 600;
            color: var(--text);
            font-size: 13.5px;
        }

        .item-list {
            color: var(--text2);
            font-size: 12.5px;
            line-height: 1.6;
        }

        .item-list div {
            margin-bottom: 2px;
        }

        .amount {
            font-family: 'Geist Mono', monospace;
            font-weight: 600;
            font-size: 13px;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
        }

        .badge-pending {
            background: rgba(245, 158, 11, 0.12);
            color: var(--warn);
        }

        .badge-confirmed {
            background: rgba(34, 211, 165, 0.1);
            color: var(--success);
        }

        .badge-cancelled {
            background: rgba(244, 63, 94, 0.1);
            color: var(--danger);
        }

        .badge-in-stock {
            background: rgba(34, 211, 165, 0.1);
            color: var(--success);
        }

        .badge-out {
            background: rgba(244, 63, 94, 0.1);
            color: var(--danger);
        }

        /* Action buttons */
        .action-btn {
            padding: 4px 11px;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            background: none;
            transition: all 0.15s;
            font-family: 'Instrument Sans', sans-serif;
        }

        .action-confirm {
            color: var(--success);
            border-color: rgba(74, 222, 128, 0.25);
        }

        .action-confirm:hover {
            background: rgba(74, 222, 128, 0.1);
        }

        .action-cancel {
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.25);
        }

        .action-cancel:hover {
            background: rgba(248, 113, 113, 0.1);
        }

        .action-edit {
            color: var(--text2);
            border-color: var(--border2);
        }

        .action-edit:hover {
            color: var(--text);
            border-color: var(--text3);
            background: var(--surface2);
        }

        .action-delete {
            color: var(--text3);
            border-color: var(--border);
        }

        .action-delete:hover {
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.25);
        }

        .actions-cell {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* Empty state */
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--text3);
        }

        .empty-icon {
            font-size: 28px;
            margin-bottom: 10px;
            opacity: 0.4;
        }

        .empty-state p {
            font-size: 13px;
        }

        /* Product name cell */
        .product-name {
            font-weight: 600;
            color: var(--text);
        }

        /* Add product form container */
        #add-product-form {
            margin-bottom: 18px;
        }

        /* HTMX spinner */
        .htmx-indicator {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .htmx-request .htmx-indicator {
            opacity: 1;
        }

        .spin-ring {
            width: 16px;
            height: 16px;
            border: 1.5px solid var(--border2);
            border-top-color: var(--text2);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .overlay.open {
                display: block;
            }

            .menu-btn {
                display: flex;
            }

            #main-content {
                padding: 18px 16px;
            }

            .topbar {
                padding: 0 16px;
            }

            .section-title {
                font-size: 15px;
            }

            th,
            td {
                padding: 10px 14px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            :root {
                --sidebar-w: 192px;
            }

            #main-content {
                padding: 22px 20px;
            }
        }

        @media (min-width: 1440px) {
            :root {
                --sidebar-w: 232px;
            }

            #main-content {
                padding: 32px 36px;
            }
        }

        /* Page load fade-in */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border2);
            border-radius: 2px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text3);
        }
    </style>
</head>

<body>

    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <div class="shell">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <div class="logo-mark">S</div>
                <span class="logo-text">Sell!</span>
            </div>

            <!-- Business Switcher -->
            {% if is_superadmin %}
            <div class="biz-switcher">
                <select id="business-selector" onchange="switchBusiness(this.value)">
                    {% for biz in businesses %}
                    <option value="{{ biz.id }}" {% if biz.id==current_business_id %}selected{% endif %}>
                        {{ biz.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}

            <span class="nav-section-label">Menu</span>

            <nav style="display:flex;flex-direction:column;gap:2px;">
                <button class="nav-item active" id="nav-dashboard" hx-get="/admin/dashboard" hx-target="#main-content"
                    hx-indicator="#spinner" onclick="setActive('dashboard'); closeSidebar()">
                    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    Dashboard
                    <span class="nav-dot"></span>
                </button>
                <button class="nav-item" id="nav-products" hx-get="/admin/products" hx-target="#main-content"
                    hx-indicator="#spinner" onclick="setActive('products'); closeSidebar()">
                    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                    </svg>
                    Products
                    <span class="nav-dot"></span>
                </button>
                <button class="nav-item" id="nav-orders" hx-get="/admin/orders" hx-target="#main-content"
                    hx-indicator="#spinner" onclick="setActive('orders'); closeSidebar()">
                    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    Orders
                    <span id="pending-badge"
                          hx-get="/api/orders/pending-count"
                          hx-trigger="load, every 30s"
                          hx-target="this"
                          style="display:none; margin-left:auto; background:var(--danger); color:var(--bg); font-size:10px; font-weight:700; padding:2px 6px; border-radius:10px; font-family:'Geist Mono',monospace; line-height:1;">
                    </span>
                    <span class="nav-dot"></span>
                </button>

                <div style="height:1px;background:var(--border);margin:6px 0;"></div>

                <button class="nav-item" id="nav-connect" hx-get="/admin/connect-form" hx-target="#main-content"
                    hx-indicator="#spinner" onclick="setActive('connect'); closeSidebar()">
                    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                    </svg>
                    Connect
                    <span class="nav-dot"></span>
                </button>
                <button class="nav-item" id="nav-settings" hx-get="/admin/settings" hx-target="#main-content"
                    hx-indicator="#spinner" onclick="setActive('settings'); closeSidebar()">
                    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    Settings
                    <span class="nav-dot"></span>
                </button>
            </nav>

            <div class="sidebar-footer">v0.1 · multi-tenant AI sales</div>
        </aside>

        <!-- Main -->
        <div class="main">
            <!-- Topbar -->
            <div class="topbar">
                <button class="menu-btn" onclick="openSidebar()" aria-label="Open menu">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <span class="topbar-title" id="topbar-label">/ dashboard</span>
                <div class="spinner-wrap htmx-indicator" id="spinner">
                    <div class="spin-ring"></div>
                </div>
            </div>

            <!-- Content -->
            <div id="main-content">
                <div hx-get="/admin/dashboard" hx-trigger="load"></div>
            </div>
        </div>
    </div>

    <script>
        function openSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('overlay').classList.add('open');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('open');
        }
        function setActive(page) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('nav-' + page).classList.add('active');
            document.getElementById('topbar-label').textContent = '/ ' + page;
        }

        // Re-trigger fade animation on HTMX content swap
        document.body.addEventListener('htmx:afterSwap', function (e) {
            if (e.target.id === 'main-content') {
                e.target.style.animation = 'none';
                e.target.offsetHeight; // reflow
                e.target.style.animation = '';
            }
        });

        // Handle pending badge visibility
        document.body.addEventListener('htmx:afterSwap', function (e) {
            if (e.target.id === 'pending-badge') {
                const count = parseInt(e.target.innerText);
                if (count > 0) {
                    e.target.style.display = 'inline-block';
                    e.target.innerText = count;
                } else {
                    e.target.style.display = 'none';
                }
            }
        });

        function switchBusiness(businessId) {
            fetch('/admin/switch-business/' + businessId, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            }).then(() => {
                window.location.reload();
            });
        }
    </script>
