<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell! – Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --border: #222222;
            --border2: #2e2e2e;
            --text: #efefef;
            --text2: #888888;
            --text3: #555555;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Instrument Sans', sans-serif;
            font-size: 14px;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 100%;
            max-width: 360px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px 28px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .logo-mark {
            width: 30px;
            height: 30px;
            background: var(--text);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Geist Mono', monospace;
            font-weight: 600;
            font-size: 14px;
            color: var(--bg);
        }

        .logo-text {
            font-family: 'Geist Mono', monospace;
            font-weight: 600;
            font-size: 15px;
            color: var(--text);
        }

        h2 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text2);
            margin-bottom: 20px;
            letter-spacing: 0.01em;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .field label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: var(--text3);
            font-family: 'Geist Mono', monospace;
        }

        .field input {
            background: #0a0a0a;
            border: 1px solid var(--border2);
            border-radius: 8px;
            padding: 10px 13px;
            color: var(--text);
            font-family: 'Instrument Sans', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
            width: 100%;
        }

        .field input:focus {
            border-color: var(--text3);
        }

        .btn {
            width: 100%;
            background: var(--text);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-family: 'Instrument Sans', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.15s;
        }

        .btn:hover {
            background: #d8d8d8;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">
            <div class="logo-mark">S</div>
            <span class="logo-text">Sell!</span>
        </div>
        <h2>Create your account</h2>
        <form method="POST" action="/signup">
            <div class="field">
                <label>Business Name</label>
                <input type="text" name="business_name" placeholder="Enter business name" required autofocus>
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter email" required>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" placeholder="Min 6 characters" required minlength="6">
            </div>
            <button type="submit" class="btn">Sign Up</button>
        </form>
        <p style="text-align:center;font-size:13px;color:var(--text3);margin-top:20px;">
            Already have an account? <a href="/login" style="color:var(--text);text-decoration:underline;">Log in</a>
        </p>
    </div>
</body>

</html>
