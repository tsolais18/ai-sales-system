<div>
    <div class="section-header">
        <h2 class="section-title">Connect a Business</h2>
    </div>

    <div class="form-card">
        <form hx-post="/admin/channels/add" hx-target="#result" hx-indicator="#spinner"
            style="display:flex;flex-direction:column;gap:16px;">
            <div class="field">
                <label>Business Name</label>
                <input type="text" name="business_name" placeholder="e.g. Cupa Books" required>
            </div>
            <div class="field">
                <label>Telegram Bot Token</label>
                <input type="text" name="token" placeholder="1234567890:ABCDE..." required>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:4px;align-self:flex-start;">
                Connect Channel
            </button>
        </form>
        <div id="result" style="margin-top:16px;font-size:13px;color:var(--text2);"></div>
    </div>
</div>
