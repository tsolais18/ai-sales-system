<div>
    <div class="section-header">
        <h2 class="section-title">AI Settings</h2>
        <span style="font-size:12px;color:var(--text3);font-family:'Geist Mono',monospace;">Customise how Sell talks to
            customers</span>
    </div>

    <div class="form-card">
        <form hx-post="/api/business/settings" hx-target="#settings-result"
            style="display:flex;flex-direction:column;gap:18px;">

            <div class="field">
                <label>Conversation Tone</label>
                <select name="tone">
                    <option value="friendly" {% if settings.tone=='friendly' %}selected{% endif %}>Friendly & Warm
                    </option>
                    <option value="formal" {% if settings.tone=='formal' %}selected{% endif %}>Formal & Professional
                    </option>
                    <option value="casual" {% if settings.tone=='casual' %}selected{% endif %}>Casual & Relaxed</option>
                </select>
            </div>

            <div class="field">
                <label>Sales Approach</label>
                <select name="sales_style">
                    <option value="balanced" {% if settings.sales_style=='balanced' %}selected{% endif %}>Balanced
                    </option>
                    <option value="premium_first" {% if settings.sales_style=='premium_first' %}selected{% endif %}>Push
                        Premium Products</option>
                    <option value="discount_focused" {% if settings.sales_style=='discount_focused' %}selected{% endif
                        %}>Mention Discounts First</option>
                    <option value="soft_sell" {% if settings.sales_style=='soft_sell' %}selected{% endif %}>Soft Sell
                        (No Pressure)</option>
                </select>
            </div>

            <div class="field">
                <label>Data Collection</label>
                <div style="display:flex;flex-direction:column;gap:10px;margin-top:2px;">
                    <label class="check-row">
                        <input type="checkbox" name="collect_phone" {% if settings.collect_phone %}checked{% endif %}>
                        Ask for phone number before order
                    </label>
                    <label class="check-row">
                        <input type="checkbox" name="collect_email" {% if settings.collect_email %}checked{% endif %}>
                        Ask for email address before order
                    </label>
                </div>
            </div>

            <div class="field">
                <label>Pricing Behaviour</label>
                <label class="check-row" style="margin-top:2px;">
                    <input type="checkbox" name="mention_price_only_when_asked" {% if
                        settings.mention_price_only_when_asked %}checked{% endif %}>
                    Don't mention price unless customer asks
                </label>
            </div>

            <!-- Admin Telegram IDs -->
            <div class="field">
                <label>Admin Telegram IDs (comma-separated)</label>
                <input type="text" name="admin_telegram_ids"
                       value="{{ settings.admin_telegram_ids or '' }}"
                       placeholder="5851987998,123456789"
                       class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-white"
                       style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg2); color: var(--text);">
                <p style="font-size:12px;color:var(--text3);margin-top:4px;">These users will receive order notifications.</p>
            </div>

            <!-- Admin WhatsApp numbers (future) -->
            <div class="field">
                <label>Admin WhatsApp Numbers (comma-separated)</label>
                <input type="text" name="admin_whatsapp_numbers"
                       value="{{ settings.admin_whatsapp_numbers or '' }}"
                       placeholder="+2348012345678,+2348098765432"
                       class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-white"
                       style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg2); color: var(--text);">
                <p style="font-size:12px;color:var(--text3);margin-top:4px;">Numbers to receive order notifications via WhatsApp (when enabled).</p>
            </div>

            <div style="padding-top:4px;">
                <button type="submit" class="btn btn-primary">Save Settings</button>
            </div>
        </form>
        <div id="settings-result" style="margin-top:14px;font-size:13px;color:var(--text2);"></div>
    </div>
</div>
